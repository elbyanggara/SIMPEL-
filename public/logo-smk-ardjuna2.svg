<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Glow / Shadow Group -->
  <g filter="url(#glow)">
    <!-- Shield / Segilima Utama -->
    <polygon points="100,8 186,40 162,154 100,192 38,154 14,40" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Inner Border Ring -->
    <polygon points="100,16 178,45 156,146 100,181 44,146 22,45" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4,2" />

    <!-- Top Arch Text Header -->
    <path id="textArcTop" d="M 32,54 Q 100,16 168,54" fill="none" stroke="none" />
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#fef08a" letter-spacing="1.5">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        SMK ARDJUNA 2
      </textPath>
    </text>

    <!-- Golden Wings (Sayap Bina Taruna) Left & Right -->
    <!-- Left Wing -->
    <path d="M 100,105 C 80,88 56,86 42,94 C 42,94 54,106 66,108 C 50,110 44,120 44,120 C 58,124 74,118 84,114 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Right Wing -->
    <path d="M 100,105 C 120,88 144,86 158,94 C 158,94 146,106 134,108 C 150,110 156,120 156,120 C 142,124 126,118 116,114 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Gear / Cakra Vokasi (Center Background) -->
    <circle cx="100" cy="104" r="26" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Gear teeth -->
    <g fill="#eab308">
      <rect x="97" y="75" width="6" height="5" rx="1" />
      <rect x="97" y="128" width="6" height="5" rx="1" />
      <rect x="71" y="101" width="5" height="6" rx="1" />
      <rect x="124" y="101" width="5" height="6" rx="1" />
      <rect x="80" y="82" width="5" height="5" rx="1" transform="rotate(45 82.5 84.5)" />
      <rect x="115" y="121" width="5" height="5" rx="1" transform="rotate(45 117.5 123.5)" />
      <rect x="80" y="121" width="5" height="5" rx="1" transform="rotate(-45 82.5 123.5)" />
      <rect x="115" y="82" width="5" height="5" rx="1" transform="rotate(-45 117.5 84.5)" />
    </g>

    <!-- Arjuna's Bow (Busur Panah Ksatria) -->
    <path d="M 68,104 Q 100,68 132,104" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="68" y1="104" x2="132" y2="104" stroke="#facc15" stroke-width="1.2" stroke-dasharray="2,2" />

    <!-- Open Book (Buku Terbuka Pengetahuan) -->
    <path d="M 100,120 C 90,114 74,114 62,118 L 62,132 C 74,128 90,128 100,134 C 110,128 126,128 138,132 L 138,118 C 126,114 110,114 100,120 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <line x1="100" y1="120" x2="100" y2="134" stroke="#0284c7" stroke-width="1.8" />
    <!-- Book Lines -->
    <line x1="68" y1="122" x2="94" y2="120" stroke="#94a3b8" stroke-width="1" />
    <line x1="68" y1="126" x2="94" y2="124" stroke="#94a3b8" stroke-width="1" />
    <line x1="106" y1="120" x2="132" y2="122" stroke="#94a3b8" stroke-width="1" />
    <line x1="106" y1="124" x2="132" y2="126" stroke="#94a3b8" stroke-width="1" />

    <!-- Torch / Obor Perjuangan (Tegak di Tengah) -->
    <!-- Handle -->
    <path d="M 97,114 L 103,114 L 101,130 L 99,130 Z" fill="#ca8a04" />
    <!-- Torch Cup -->
    <path d="M 95,96 L 105,96 L 103,104 L 97,104 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
    <!-- Burning Flame -->
    <path d="M 100,74 C 95,82 92,88 95,94 C 97,97 103,97 105,94 C 108,88 105,82 100,74 Z" fill="url(#flameGrad)" />
    <!-- Inner Flame Core -->
    <path d="M 100,82 C 98,86 97,89 98,92 C 99,94 101,94 102,92 C 103,89 102,86 100,82 Z" fill="#ffffff" opacity="0.9" />

    <!-- Big Center Monogram "2" / Ardjuna 2 Tag -->
    <circle cx="100" cy="148" r="9" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="100" y="152" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="900" fill="#facc15" text-anchor="middle">2</text>

    <!-- Bottom Ribbon / Pita Kota Malang -->
    <path d="M 52,156 L 100,165 L 148,156 L 142,170 L 100,178 L 58,170 Z" fill="#b91c1c" stroke="url(#goldGrad)" stroke-width="1.2" />
    <text x="100" y="171" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      KOTA MALANG
    </text>

    <!-- Star Top Badge -->
    <polygon points="100,24 102,28 106,29 103,32 104,36 100,34 96,36 97,32 94,29 98,28" fill="#fef08a" />
  </g>
</svg>
